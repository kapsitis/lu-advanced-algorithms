<text x="20" y="432" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#222" text-anchor="start" font-weight="normal">H = E<tspan baseline-shift="sub" font-size="75%">K</tspan>(0<tspan baseline-shift="super" font-size="75%">128</tspan>),   S = A·H<tspan baseline-shift="super" font-size="75%">4</tspan> ⊕ C<tspan baseline-shift="sub" font-size="75%">1</tspan>·H<tspan baseline-shift="super" font-size="75%">3</tspan> ⊕ C<tspan baseline-shift="sub" font-size="75%">2</tspan>·H<tspan baseline-shift="super" font-size="75%">2</tspan> ⊕ L·H,   T = S ⊕ E<tspan baseline-shift="sub" font-size="75%">K</tspan>(J<tspan baseline-shift="sub" font-size="75%">0</tspan>)</text>
<text x="20" y="452" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal">Multiplication · H is done in GF(2<tspan baseline-shift="super" font-size="75%">128</tspan>) modulo x<tspan baseline-shift="super" font-size="75%">128</tspan> + x<tspan baseline-shift="super" font-size="75%">7</tspan> + x<tspan baseline-shift="super" font-size="75%">2</tspan> + x + 1;  L = len(A) ‖ len(C).</text>
