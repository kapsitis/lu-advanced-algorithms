<rect x="286" y="206" width="34" height="22" rx="3" fill="#dcecd8" stroke="#54A24B" stroke-width="1.2"/>
<text x="303" y="224" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="15" fill="#234d1c" text-anchor="middle" font-weight="bold">G</text>
<text x="366" y="224" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#333" text-anchor="start" font-weight="normal" xml:space="preserve">3·16 + 4 − 4  =  48</text>
<rect x="20" y="236" width="624" height="30" rx="3" fill="#fbfcfd" stroke="#dde3e9" stroke-width="1"/>
<text x="80" y="258" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="15" fill="#16324f" text-anchor="middle" font-weight="bold">48</text>
