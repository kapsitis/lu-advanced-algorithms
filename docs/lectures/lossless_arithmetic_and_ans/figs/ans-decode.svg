<text x="303" y="190" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="15" fill="#7a3d00" text-anchor="middle" font-weight="bold">C</text>
<text x="366" y="190" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#333" text-anchor="start" font-weight="normal" xml:space="preserve">1·164 + 3 − 3  =  164</text>
<rect x="20" y="202" width="624" height="30" rx="3" fill="#f2f5f8" stroke="#dde3e9" stroke-width="1"/>
<text x="80" y="224" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="15" fill="#16324f" text-anchor="middle" font-weight="bold">164</text>
