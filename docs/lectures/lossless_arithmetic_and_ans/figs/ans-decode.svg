<text x="366" y="156" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#333" text-anchor="start" font-weight="normal" xml:space="preserve">3·547 + 2 − 0  =  1643</text>
<rect x="20" y="168" width="624" height="30" rx="3" fill="#fbfcfd" stroke="#dde3e9" stroke-width="1"/>
