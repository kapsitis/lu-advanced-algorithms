<text x="303" y="258" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="15" fill="#4f2a48" text-anchor="middle" font-weight="bold">U</text>
<text x="366" y="258" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#333" text-anchor="start" font-weight="normal" xml:space="preserve">2·4 + 8 − 7  =  9</text>
<rect x="20" y="270" width="624" height="30" rx="3" fill="#f2f5f8" stroke="#dde3e9" stroke-width="1"/>
<text x="80" y="292" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="15" fill="#16324f" text-anchor="middle" font-weight="bold">9</text>
<text x="200" y="292" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="15" fill="#333" text-anchor="middle" font-weight="normal">9</text>
<rect x="286" y="274" width="34" height="22" rx="3" fill="#e8e2dc" stroke="#9C755F" stroke-width="1.2"/>
<text x="303" y="292" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="15" fill="#4a382c" text-anchor="middle" font-weight="bold">$</text>
<text x="366" y="292" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#333" text-anchor="start" font-weight="normal" xml:space="preserve">1·0 + 9 − 9  =  0</text>
<text x="20" y="326" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B22222" text-anchor="start" font-weight="normal">x = 0  →  viss ziņojums atkodēts, stāvoklis atgriezies sākumā.</text>
<text x="20" y="352" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#16324f" text-anchor="start" font-weight="bold">Atkodētais ziņojums:  G A C G U $</text>
</svg>
