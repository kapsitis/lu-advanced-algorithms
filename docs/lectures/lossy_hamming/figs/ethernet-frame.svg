<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Ethernet kadrs un kontrolsummas">
<title>Ethernet kadrs un kontrolsummas</title>
<rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/></marker></defs>
<text x="20" y="28" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="bold">Ethernet II kadrs (kanāla slānis, OSI 2. slānis)</text>
<rect x="20" y="50" width="110" height="56" rx="0" fill="#eceff3" stroke="#8a96a3" stroke-width="1.4"/>
<text x="75" y="79" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Preambula</text>
<text x="75" y="122" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">56 biti</text>
<rect x="130" y="50" width="50" height="56" rx="0" fill="#eceff3" stroke="#8a96a3" stroke-width="1.4"/>
<text x="155" y="79" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">SFD</text>
<text x="155" y="122" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">8 biti</text>
<rect x="180" y="50" width="120" height="56" rx="0" fill="#f4f6f8" stroke="#5a6a7a" stroke-width="1.4"/>
<text x="240" y="73" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Mērķa</text>
<text x="240" y="85" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">MAC adrese</text>
<text x="240" y="122" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">48 biti</text>
<rect x="300" y="50" width="120" height="56" rx="0" fill="#f4f6f8" stroke="#5a6a7a" stroke-width="1.4"/>
<text x="360" y="73" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Sūtītāja</text>
<text x="360" y="85" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">MAC adrese</text>
<text x="360" y="122" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">48 biti</text>
<rect x="420" y="50" width="90" height="56" rx="0" fill="#f4f6f8" stroke="#5a6a7a" stroke-width="1.4"/>
<text x="465" y="79" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">EtherType</text>
<text x="465" y="122" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">16 biti</text>
<rect x="510" y="50" width="300" height="56" rx="0" fill="#dbe6f3" stroke="#4C78A8" stroke-width="1.4"/>
<text x="660" y="79" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Dati (payload)</text>
<text x="660" y="122" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">368 – 12 000 biti (46 – 1500 baiti)</text>
<rect x="810" y="50" width="100" height="56" rx="0" fill="#fde5cc" stroke="#F58518" stroke-width="1.4"/>
<text x="860" y="73" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">FCS</text>
<text x="860" y="85" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">CRC-32</text>
<text x="860" y="122" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">32 biti</text>
<path d="M 180 136 L 180 144 L 810 144 L 810 136" stroke="#F58518" stroke-width="1.6" fill="none"/>
<path d="M 495 144 L 495 162 L 860 162" stroke="#F58518" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
<line x1="860" y1="162" x2="860" y2="130" stroke="#F58518" stroke-width="1.6" marker-end="url(#arw)"/>
<text x="495" y="180" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">sūtītājs aprēķina CRC-32 no šiem laukiem un ieraksta to FCS laukā; saņēmējs pārrēķina un bojātu kadru izmet</text>
<text x="100" y="148" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">sinhronizācija (nepārbauda)</text>
<text x="20" y="252" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="bold">Ethernet datu lauka saturs: IPv4 pakete ar TCP segmentu</text>
<rect x="60" y="290" width="260" height="56" rx="0" fill="#f4f6f8" stroke="#5a6a7a" stroke-width="1.4"/>
<text x="190" y="319" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal"></text>
<text x="190" y="362" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">160 biti (bez opcijām)</text>
<rect x="320" y="290" width="260" height="56" rx="0" fill="#f4f6f8" stroke="#5a6a7a" stroke-width="1.4"/>
<text x="450" y="319" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal"></text>
<text x="450" y="362" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">160 biti (bez opcijām)</text>
<rect x="580" y="290" width="300" height="56" rx="0" fill="#dbe6f3" stroke="#4C78A8" stroke-width="1.4"/>
<text x="730" y="319" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">TCP dati</text>
<text x="730" y="362" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">pārējie biti</text>
<rect x="228" y="296" width="84" height="44" rx="3" fill="#dcecd8" stroke="#54A24B" stroke-width="1.6"/>
<text x="270" y="316" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#222" text-anchor="middle" font-weight="bold">kontrolsumma</text>
<text x="270" y="330" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle" font-weight="normal">80.–95. bits</text>
<rect x="488" y="296" width="84" height="44" rx="3" fill="#dcecd8" stroke="#54A24B" stroke-width="1.6"/>
<text x="530" y="316" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#222" text-anchor="middle" font-weight="bold">kontrolsumma</text>
<text x="530" y="330" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle" font-weight="normal">128.–143. bits</text>
<text x="144" y="323" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">IPv4 galvene</text>
<text x="404" y="323" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">TCP galvene</text>
<text x="60" y="386" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">IPv4 galvenes kontrolsumma sargā tikai IP galveni; TCP kontrolsumma — TCP galveni un datus (un IP adreses).</text>
<text x="60" y="404" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">Abas ir 16 bitu vārdu summa ar pārnesi (vieninieku papildkods) — daudz vājākas par CRC-32.</text>
</svg>
