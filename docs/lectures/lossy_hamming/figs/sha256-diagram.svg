<rect x="478" y="58" width="110" height="50" rx="0" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="533" y="87" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">0 … 0</text>
<rect x="588" y="58" width="110" height="50" rx="0" fill="#fde5cc" stroke="#F58518" stroke-width="1.4"/>
<text x="643" y="87" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">L (64 biti)</text>
<text x="465" y="126" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#444" text-anchor="middle" font-weight="normal">papildināšana: kopējais garums dalās ar 512</text>
<line x1="702" y1="83" x2="750" y2="83" stroke="#444" stroke-width="1.8" marker-end="url(#arw)"/>
