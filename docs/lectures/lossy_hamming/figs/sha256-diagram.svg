<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="SHA-256 aprēķins">
<title>SHA-256 aprēķins</title>
<rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/></marker></defs>
<text x="20" y="28" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="bold">SHA-256: jebkāda garuma ievade → 256 bitu vērtība</text>
<rect x="20" y="58" width="150" height="50" rx="6" fill="#f4f6f8" stroke="#5a6a7a" stroke-width="1.4"/>
<text x="95" y="79" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">ziņojums m</text>
<text x="95" y="96" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">L biti, L &lt; 2<tspan baseline-shift="super" font-size="75%">64</tspan></text>
